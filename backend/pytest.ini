[pytest]
testpaths = tests
addopts = -q --strict-markers
markers =
    unit: testes sem banco (configuração, travas, regras puras)
    integracao: app Flask real + PostgreSQL real (bytedonto_test)
    rotas: rotas e autenticação
    rbac: permissões por papel
    isolamento: isolamento entre clínicas
    estoque: módulo de estoque
    esterilizacao: módulo de esterilização
    migrations: migrations SQL e RLS
    agenda: regras de agendamento (sobreposição, ciclo de vida, concorrência)
    prontuario: permissões de pacientes e informações clínicas
    documentos: acesso a documentos clínicos (upload, download, links assinados)
    banco_compartilhado: o módulo monta o cenário uma vez e só lê/nega (não limpa o banco entre testes)
filterwarnings =
    ignore::DeprecationWarning:app.financeiro.routes
